syntax = "proto3";
package velda;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "velda.io/velda/pkg/proto";

message SearchImagesRequest {
  string query = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message Image {
  string id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  string github_link = 5;
  string latest_image_id = 7;
  string cover_photo = 8;
  int64 creation_count = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  string region = 12;
  reserved 6;
}

message SearchImagesResponse {
  repeated Image images = 1;
}

service ImageManagementEnt {
  rpc SearchImages(SearchImagesRequest) returns (SearchImagesResponse) {
    option (google.api.http) = {
      get: "/rest/images/search"
    };
  }
}
